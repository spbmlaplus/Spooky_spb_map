<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spooky_spb_map</title>
  <meta name="description" content="Карта страшилок, поверий и легенд районов Петербурга от МЛА+">
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="maplibre-gl.css">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="refinements.css?v=district-form-5">
</head>
<body>
  <div id="map" aria-label="Карта"></div>

  <a class="logo" id="logo" href="https://mlaplus.ru/" target="_blank" rel="noopener" aria-label="МЛА+">
    <img src="logo-mla.svg" alt="МЛА+">
  </a>

  <!-- нижняя панель -->
  <div class="hud" id="hud">
    <nav class="tools" id="tools" aria-label="Инструменты">
      <button class="tool" id="btn-legend" type="button" aria-label="Что на карте">
        <img class="tool-icon" src="Легенда.svg" alt="">
        <span class="tip">Что на карте</span>
      </button>
      <button class="tool" id="btn-heat" type="button" aria-pressed="false" aria-label="Плотность">
        <img class="tool-icon" src="Плотность сервисов.svg" alt="">
        <span class="tip">Плотность ужасающих сервисов</span>
      </button>
      <button class="tool" id="btn-random" type="button" aria-label="Случайный район">
        <img class="tool-icon" src="Испытай удачу.svg" alt="">
        <span class="tip">Испытать судьбу</span>
      </button>
      <button class="tool" id="btn-search" type="button" aria-label="Найти район">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <span class="tip">Найти район</span>
      </button>
      <div class="search" id="search" hidden>
        <input id="search-input" type="search" placeholder="Название района или легенды…" autocomplete="off">
        <ul id="search-list"></ul>
      </div>
    </nav>

    <div class="center" id="center">
      <section class="strip" id="strip" aria-label="Легенда">
        <button class="back-btn" id="heat-back" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>К жутким историям районов</span>
        </button>
        <button class="strip-toggle" id="strip-toggle" type="button" aria-expanded="true">
          <span id="strip-title"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="chips" id="chips"></div>
        <div class="heatbar" id="heatbar" hidden></div>
      </section>
      <div class="solo-hint" id="solo-hint" hidden></div>
      <div class="fear" id="fear">
        <div class="fear-track" id="fear-track">
          <div class="fear-fill" id="fear-fill"></div>
          <span class="fear-dot" style="left:0%"></span>
          <span class="fear-dot" style="left:50%"></span>
          <span class="fear-dot" style="left:100%"></span>
          <div class="ghost" id="ghost" role="slider" tabindex="0" aria-label="Уровень страха" aria-valuemin="0" aria-valuemax="2">
            <img src="ghost.svg" alt="" draggable="false">
          </div>
        </div>
        <div class="fear-ticks" aria-hidden="true"><span>спокойно</span><span>опасненько</span><span>жутко</span></div>
        <div class="bubble" id="bubble" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
    <div class="hud-spacer"></div>
  </div>

  <!-- управление картой -->
  <div class="mapctl" id="mapctl">
    <button type="button" id="z-in" aria-label="Приблизить" title="Приблизить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="z-out" aria-label="Отдалить" title="Отдалить"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button type="button" id="z-home" aria-label="Весь город" title="Весь город"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></button>
    <button type="button" id="z-loc" aria-label="Что жуткого рядом со мной" title="Что жуткого рядом со мной"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  </div>

  <!-- панель района (справа) -->
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="grab" id="grab"></div>
    <div class="panel-inner" id="panel-inner">
      <header class="panel-top">
        <button class="pbtn" id="p-prev" type="button" aria-label="Предыдущий район" title="Предыдущий район (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="pbtn" id="p-next" type="button" aria-label="Следующий район" title="Следующий район (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <span class="ptools">
          <button class="pbtn" id="p-share" type="button" aria-label="Поделиться" title="Скопировать ссылку на район"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
          <button class="x" data-close="panel" aria-label="Закрыть"></button>
        </span>
      </header>
      <div class="p-meta">
        <span class="chip" id="p-type"><i></i><b></b></span>
        <span class="fearchip" id="p-fear"></span>
      </div>
      <div class="swap" id="p-swap">
        <h2 class="p-title" id="p-title"></h2>
        <div class="p-sub" id="p-sub"></div>
        <hr>
        <div class="p-desc" id="p-desc"></div>
        <section class="p-objects" id="p-objects">
          <hr>
          <h3 id="p-objects-title"></h3>
          <ul id="p-list"></ul>
        </section>
        <section class="near" id="p-near">
          <hr>
          <h3>Рядом тоже жутко</h3>
          <div class="near-list" id="near-list"></div>
        </section>
        <section class="crowd" id="crowd">
          <hr>
          <h3 id="crowd-title"></h3>
          <ul class="stories" id="stories"></ul>
          <button class="crowd-cta" id="crowd-open" type="button" aria-expanded="false" aria-controls="crowd-embed"></button>
          <div class="crowd-embed" id="crowd-embed" hidden>
            <p class="story-note">Расскажи историю этого района. Можно анонимно — не указывай контакты и чужие персональные данные.</p>
            <label class="story-consent"><input type="checkbox" id="story-consent"> <span>Я согласен(на) на обработку сведений, которые добровольно укажу в истории, командой МЛА+ для рассмотрения истории. Понимаю, что ответ передаётся через Google Формы.</span></label>
            <button class="cta small" id="story-consent-go" type="button" disabled>Перейти к вопросу</button>
            <div id="story-frame-wrap" hidden><p class="story-note">Форма для района: <strong id="story-district-name"></strong></p><iframe id="story-frame" title="Рассказать историю района" width="100%" height="580" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
            <button class="textlink" id="story-close" type="button">Свернуть форму</button>
          </div>
          <p class="crowd-msg" id="crowd-msg" role="status" aria-live="polite" hidden></p>
        </section>
      </div>
    </div>
  </aside>

  <!-- окна -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="modal intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden>
    <button class="x" data-close="intro" aria-label="Закрыть"></button>
    <img id="intro-ghost" class="intro-ghost" src="ghost.svg" alt="Твой проводник — призрак">
    <h1 id="intro-title"></h1>
    <hr>
    <ul class="howto" id="howto"></ul>
    <div class="intro-text" id="intro-text"></div>
    <button class="cta" id="intro-go" type="button"></button>
  </section>
  <section class="modal stats" id="legend" role="dialog" aria-modal="true" aria-labelledby="legend-title" hidden>
    <button class="x" data-close="legend" aria-label="Закрыть"></button>
    <h2 id="legend-title"></h2>
    <hr>
    <div class="legend-list" id="legend-list"></div>
    <div id="stats"></div>
  </section>
  <script src="leaflet.js"></script>
  <script src="maplibre-gl.js"></script>
  <script src="leaflet-maplibre-gl.js"></script>
  <script src="basemap.js"></script>
  <script src="settings.js?v=club-hope-1"></script>
  <script src="bubbles.js?v=club-hope-1"></script>
  <script src="location.js?v=kugusheva-1"></script>
  <script src="heatmap.js"></script>
  <script src="servises.js"></script>
  <script src="app.js?v=district-form-5"></script>
</body>
</html>
